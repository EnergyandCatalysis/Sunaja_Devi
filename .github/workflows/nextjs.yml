# Daily automated sync and deployment workflow for Next.js site to GitHub Pages
name: Deploy Next.js site to Pages

on:
  # Daily automatic sync at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'

  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows manual workflow triggering from Actions tab
  workflow_dispatch:

# Permissions for GitHub Pages deployment & repository auto-commits
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Fetch & Sync Live Google Scholar Data
        run: node scripts/fetch-scholar-stats.mjs

      - name: Auto-commit Updated Scholar & Publication Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/scholarStats.json src/data/latestPublications.json src/data/selectedPublications.json
          git diff --staged --quiet || (git commit -m "auto: periodic sync of Google Scholar stats & publication metadata [skip ci]" && git push origin main)

      - name: Build with Next.js
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
